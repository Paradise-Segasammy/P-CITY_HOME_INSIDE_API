services:
  home-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-api
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3001}"
    # If OCI_LIB_DIR is set to /opt/oracle/instantclient, mount the server's
    # Oracle Instant Client directory there:
    # volumes:
    #   - ${ORACLE_INSTANT_CLIENT_DIR}:/opt/oracle/instantclient:ro
